<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Galáxia Dinâmica</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
  <!-- Carregando Three.js e loaders via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/MTLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>
<script>
  const scene = new THREE.Scene();
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(512, 512);
  document.body.appendChild(renderer.domElement);

  // 🛰️ Câmera ortográfica fixa
  const camera = new THREE.OrthographicCamera(-256, 256, 256, -256, 0.1, 1000);
  camera.position.set(0, 0, 100);
  camera.lookAt(0, 0, 0);

  // 💡 Iluminação
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const light = new THREE.DirectionalLight(0xffffff, 0.8);
  light.position.set(100, 200, 100);
  scene.add(light);

  // 🌌 Fundo animado com duas imagens
  const bgWidth = 512;
  const bgHeight = 512;
  let bg1, bg2;
  const bgSpeed = 1;

  new THREE.TextureLoader().load('models/galaxy-loop.jpg', texture => {
    const geometry = new THREE.PlaneGeometry(bgWidth, bgHeight);
    const material = new THREE.MeshBasicMaterial({ map: texture });

    bg1 = new THREE.Mesh(geometry, material);
    bg2 = new THREE.Mesh(geometry, material);

    bg1.position.set(0, 0, -10);
    bg2.position.set(0, bgHeight, -10);

    scene.add(bg1);
    scene.add(bg2);
  });

  // 🛸 Nave 3D centralizada
  let spaceship;
  const keys = {};
  window.addEventListener('keydown', e => keys[e.key] = true);
  window.addEventListener('keyup', e => keys[e.key] = false);

  const mtlLoader = new THREE.MTLLoader();
  mtlLoader.setPath('models/');
  mtlLoader.load('nave-3d.mtl', materials => {
    materials.preload();
    const objLoader = new THREE.OBJLoader();
    objLoader.setMaterials(materials);
    objLoader.setPath('models/');
    objLoader.load('nave-3d.obj', obj => {
      spaceship = obj;
      spaceship.scale.set(10, 10, 10); // Ajuste de escala visível
      spaceship.position.set(0, -100, 0); // Visível no meio da tela
      scene.add(spaceship);
    });
  });

  function update() {
    if (bg1 && bg2) {
      bg1.position.y -= bgSpeed;
      bg2.position.y -= bgSpeed;

      if (bg1.position.y <= -bgHeight) {
        bg1.position.y = bg2.position.y + bgHeight;
      }
      if (bg2.position.y <= -bgHeight) {
        bg2.position.y = bg1.position.y + bgHeight;
      }
    }

    if (spaceship) {
      const moveSpeed = 2;
      if (keys['ArrowLeft']) spaceship.position.x -= moveSpeed;
      if (keys['ArrowRight']) spaceship.position.x += moveSpeed;
      if (keys['ArrowUp']) spaceship.position.y += moveSpeed;
      if (keys['ArrowDown']) spaceship.position.y -= moveSpeed;
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    update();
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
